<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>VICKY ARMY 💲</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(86,50,190,.32),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(0,105,180,.28),
            transparent 34%
        ),
        #05060b;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}

/* CENTER AREA */
.wrapper{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px 18px;
}

/* MAIN GLASS BOX */
.card{
    width:100%;
    max-width:455px;

    padding:50px 28px 28px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(35,32,67,.78),
            rgba(14,15,22,.94)
        );

    border:1px solid rgba(255,255,255,.13);

    border-radius:34px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.60),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    position:relative;
    overflow:hidden;
}

/* TOP GLOW */
.card:before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-110px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(91,69,255,.20);

    filter:blur(65px);

    border-radius:50%;

    pointer-events:none;
}

/* BOTTOM BLUE GLOW */
.card:after{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    right:-170px;
    bottom:-150px;

    background:rgba(0,130,220,.20);

    filter:blur(65px);

    border-radius:50%;

    pointer-events:none;
}

/* DP */
.profile{
    width:118px;
    height:118px;

    margin:0 auto;

    padding:4px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #6648ff,
            #896cff,
            #268cff
        );

    box-shadow:
        0 0 18px rgba(90,75,255,.80),
        0 0 38px rgba(65,110,255,.30);

    position:relative;
    z-index:2;
}

.profile img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:2px solid #090912;
}

/* HEADLINE */
.title{
    margin-top:30px;

    font-size:34px;

    line-height:1.15;

    font-weight:800;

    letter-spacing:.2px;

    background:
        linear-gradient(
            90deg,
            #7770ff,
            #91a1ff,
            #7183ff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    position:relative;
    z-index:2;
}

/* BADGE */
.badge{
    display:inline-block;

    margin-top:16px;

    padding:9px 19px;

    border-radius:30px;

    border:1px solid rgba(117,88,255,.55);

    background:rgba(72,53,145,.12);

    color:#8c9bff;

    font-size:13px;

    font-weight:700;

    position:relative;
    z-index:2;
}

/* DESCRIPTION */
.description{
    max-width:360px;

    margin:26px auto 0;

    color:#c5c4cd;

    font-size:15px;

    line-height:1.75;

    position:relative;
    z-index:2;
}

/* JOIN BUTTON */
.join-btn{
    width:100%;

    height:62px;

    margin-top:28px;

    border:0;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    text-decoration:none;

    color:#fff;

    font-size:18px;

    font-weight:800;

    background:
        linear-gradient(
            100deg,
            #6944ff,
            #3d91ff
        );

    box-shadow:
        0 8px 25px rgba(75,80,255,.35),
        0 0 35px rgba(50,120,255,.15);

    position:relative;

    overflow:hidden;

    z-index:2;

    transition:.18s ease;
}

/* BUTTON SHINE */
.join-btn:after{
    content:"";

    position:absolute;

    width:65%;
    height:100%;

    left:-120%;
    top:0;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.40),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 2.7s infinite;
}

@keyframes shine{

    0%{
        left:-120%;
    }

    55%,100%{
        left:150%;
    }
}

.join-btn:active{
    transform:scale(.97);
}

/* TELEGRAM ICON */
.telegram{
    width:25px;
    height:25px;

    fill:white;

    position:relative;
    z-index:2;
}

/* BUTTON TEXT */
.join-text{
    position:relative;
    z-index:2;
}

/* REDIRECTING */
.redirect{
    margin-top:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:11px;

    color:#777684;

    font-size:13px;

    position:relative;
    z-index:2;
}

.loader{
    width:23px;
    height:23px;

    border-radius:50%;

    border:
        3px solid
        rgba(132,105,255,.18);

    border-top-color:#866cff;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* FOOTER */
.footer{
    margin-top:27px;

    color:#666572;

    font-size:12px;

    position:relative;
    z-index:2;
}

/* PHONE */
@media(max-width:600px){

    .wrapper{
        padding:20px 16px;
    }

    .card{
        max-width:455px;

        padding:
            43px 25px
            26px;

        border-radius:31px;
    }

    .profile{
        width:112px;
        height:112px;
    }

    .title{
        margin-top:28px;
        font-size:31px;
    }

    .badge{
        margin-top:14px;
        font-size:12px;
        padding:8px 17px;
    }

    .description{
        margin-top:23px;
        font-size:14px;
        line-height:1.7;
    }

    .join-btn{
        height:61px;
        margin-top:27px;
        border-radius:17px;
        font-size:17px;
    }

    .telegram{
        width:24px;
        height:24px;
    }

    .redirect{
        margin-top:19px;
        font-size:12px;
    }

    .loader{
        width:22px;
        height:22px;
    }

    .footer{
        margin-top:25px;
        font-size:11px;
    }
}

/* VERY SMALL PHONE */
@media(max-width:380px){

    .card{
        padding-left:21px;
        padding-right:21px;
    }

    .profile{
        width:100px;
        height:100px;
    }

    .title{
        font-size:28px;
    }

    .description{
        font-size:13px;
    }

    .join-btn{
        height:57px;
        font-size:16px;
    }
}
</style>
</head>


<body>

<div class="wrapper">

    <div class="card">

        <!-- DP -->
        <div class="profile">
            <img
                src="https://d1yei2z3i6k35z.cloudfront.net/19029959/6aa5ab4bca0f71.72166505_5260.jpg"
                alt="VICKY ARMY">
        </div>


        <!-- HEADLINE -->
        <h1 class="title">
            VICKY ARMY 💲
        </h1>


        <!-- BADGE -->
        <div class="badge">
            ✓ OFFICIAL COMMUNITY
        </div>


        <!-- DESCRIPTION -->
        <p class="description">
            Join the VICKY ARMY community and stay connected
            with our latest updates and information.
        </p>


        <!-- TELEGRAM BUTTON -->
        <a
            href="https://t.me/+UdfbWJE8NpE1Nzc1"
            class="join-btn"
            target="_blank"
            rel="noopener noreferrer"
        >

            <svg
                class="telegram"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M21.5 3.5L18.2 20c-.25 1.17-.9 1.46-1.83.91l-5.02-3.7-2.42 2.33c-.27.27-.5.5-1.02.5l.36-5.1 9.28-8.38c.4-.36-.09-.56-.62-.2L5.47 13.7.55 12.16c-1.07-.33-1.09-1.07.22-1.58L20 3.1c.91-.34 1.71.2 1.5.4z"/>
            </svg>

            <span class="join-text">
                JOIN TELEGRAM
            </span>

        </a>


        <!-- REDIRECT TEXT -->
        <div class="redirect">

            <span class="loader"></span>

            <span>
                Redirecting you now...
            </span>

        </div>


        <!-- FOOTER -->
        <div class="footer">
            © 2026 VICKY ARMY 0.2
        </div>

    </div>

</div>

</body>
</html>
